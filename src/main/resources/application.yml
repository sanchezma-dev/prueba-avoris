spring:
  application:
    name: prueba-avoris
  datasource:
    url: jdbc:postgresql://localhost:5432/hotel_searches
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  sql:
    init:
      mode: always
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        "[spring.json.add.type.headers]": false
    consumer:
      group-id: hotel-search-persister
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        "[spring.json.value.default.type]": com.tech.infrastructure.kafka.models.HotelSearchMessage
        "[spring.json.use.type.headers]": false
        "[spring.json.trusted.packages]": com.tech.infrastructure.kafka.models

app:
  kafka:
    topics:
      hotel-availability-searches: hotel_availability_searches
